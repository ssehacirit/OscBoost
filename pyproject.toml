[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oscboost"
version = "1.0.0"
description = "Gradient boosting with residual sign history features (OscBoost)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Selahattin Seha Cirit"}]
dependencies = ["numpy>=2.0", "scikit-learn>=1.3"]

[tool.setuptools]
packages = ["oscboost"]
